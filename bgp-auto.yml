name: bgp-lab
mgmt:
  network: isp-bgp
  ipv4-subnet: 172.90.90.0/24

topology:
  nodes:

    rt-provider1:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:24.10.1
      type: ixr-d3
      startup-config: configs/prov1.cfg 

    rt-provider2:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:24.10.1
      type: ixr-d3
      startup-config: configs/prov2.cfg 

    rt-core:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:24.10.1
      type: ixr-d3
      startup-config: configs/core.cfg 

    rt-transit:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:24.10.1
      type: ixr-d3
      startup-config: configs/rt-transit.cfg 

    rt-google:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:24.10.1
      type: ixr-d3
      startup-config: configs/rt-google.cfg   

    rt-cloudflare:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:24.10.1
      type: ixr-d3
      startup-config: configs/rt-cf.cfg 

    DNS-google:
      kind: linux
      image: docker.io/esanchezv/kaliipv6:latest  
      exec:
       - ip -6 address add 2001:db8:700::53/64 dev eth1 
       - ip -6 route add default via 2001:db8:700::1       

    DNS-cloudflare:
      kind: linux
      image: docker.io/esanchezv/kaliipv6:latest  
      exec:
       - ip -6 address add 2001:db8:800::53/64 dev eth1 
       - ip -6 route add default via 2001:db8:800::1       

    cliente-ISP:
      kind: linux
      image: docker.io/esanchezv/kaliipv6:latest 
      exec:
       - ip -6 address add 2001:db8:100::10/64 dev eth1 
       - ip -6 route add default via 2001:db8:100::1       

 
    nornir:
      kind: linux
      image: docker.io/esanchezv/kali-python3:latest 
      binds:
       - configs/nornir.sh:/root/nornir.sh
       - configs/nornir/automation:/root/automation
      exec:
       - python3 -m pip config set global.break-system-packages true
       - chmod +x /root/nornir.sh
       - bash /root/nornir.sh    
       - ip -6 address add 2001:db8:200::10/64 dev eth1 
       - ip -6 route add default via 2001:db8:200::1      

    ianetops:
      kind: linux
      image: docker.io/esanchezv/kali-python3:latest 
      binds:
       - configs/ianet.sh:/root/ianet.sh
       - scripts:/root/automation
      exec:
       - python3 -m pip config set global.break-system-packages true
       - chmod +x /root/ianet.sh
       - bash /root/ianet.sh    
       #- ip -6 address add 2001:db8:ca01::100/64 dev eth1 
       #- ip -6 route add default via 2001:db8:ca01::1   

