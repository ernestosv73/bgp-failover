set /network-instance default admin-state enable
set /network-instance default ip-forwarding receive-ipv6-check true

set /interface ethernet-1/1 description "eBGP -> Provider1 AS65002"
set /interface ethernet-1/1 admin-state enable
set /interface ethernet-1/1 subinterface 0 admin-state enable
set /interface ethernet-1/1 subinterface 0 ipv6 admin-state enable
set /interface ethernet-1/1 subinterface 0 ipv6 address 2001:db8:1::1/64
set /network-instance default interface ethernet-1/1.0

set /interface ethernet-1/2 description "eBGP -> Provider2 AS65003"
set /interface ethernet-1/2 admin-state enable
set /interface ethernet-1/2 subinterface 0 admin-state enable
set /interface ethernet-1/2 subinterface 0 ipv6 admin-state enable
set /interface ethernet-1/2 subinterface 0 ipv6 address 2001:db8:2::1/64
set /network-instance default interface ethernet-1/2.0

set /interface ethernet-1/3 description "ISP LAN"
set /interface ethernet-1/3 admin-state enable
set /interface ethernet-1/3 subinterface 0 admin-state enable
set /interface ethernet-1/3 subinterface 0 ipv6 admin-state enable
set /interface ethernet-1/3 subinterface 0 ipv6 address 2001:db8:100::1/64
set /network-instance default interface ethernet-1/3.0

set /interface ethernet-1/4 description "Management Network"
set /interface ethernet-1/4 admin-state enable
set /interface ethernet-1/4 subinterface 0 admin-state enable
set /interface ethernet-1/4 subinterface 0 ipv6 admin-state enable
set /interface ethernet-1/4 subinterface 0 ipv6 address 2001:db8:200::1/64
set /network-instance default interface ethernet-1/4.0

set /interface system0 admin-state enable
set /interface system0 subinterface 0 admin-state enable
set /interface system0 subinterface 0 ipv6 admin-state enable
set /interface system0 subinterface 0 ipv6 address 2001:db8:6500::1/128
set /network-instance default interface system0.0

set /network-instance default protocols bgp admin-state enable
set /network-instance default protocols bgp autonomous-system 65000
set /network-instance default protocols bgp router-id 10.0.0.1
set /network-instance default protocols bgp afi-safi ipv6-unicast admin-state enable

set /network-instance default protocols bgp group backbone-prov1 admin-state enable
set /network-instance default protocols bgp group backbone-prov1 description "Primary Upstream"
set /network-instance default protocols bgp group backbone-prov1 afi-safi ipv6-unicast admin-state enable

set /network-instance default protocols bgp neighbor 2001:db8:1::2 admin-state enable
set /network-instance default protocols bgp neighbor 2001:db8:1::2 description "Provider1 AS65002"
set /network-instance default protocols bgp neighbor 2001:db8:1::2 peer-as 65002
set /network-instance default protocols bgp neighbor 2001:db8:1::2 peer-group backbone-prov1

set /network-instance default protocols bgp group backbone-prov2 admin-state enable
set /network-instance default protocols bgp group backbone-prov2 description "Secundary Upstream"
set /network-instance default protocols bgp group backbone-prov2 afi-safi ipv6-unicast admin-state enable

set /network-instance default protocols bgp neighbor 2001:db8:2::2 admin-state enable
set /network-instance default protocols bgp neighbor 2001:db8:2::2 description "Provider2 AS65003"
set /network-instance default protocols bgp neighbor 2001:db8:2::2 peer-as 65003
set /network-instance default protocols bgp neighbor 2001:db8:2::2 peer-group backbone-prov2

set /routing-policy community-set ISP-LAN member [65000:100]
set /routing-policy community-set MONITOR-P1 member [65000:200]

set /routing-policy prefix-set ISP-LAN prefix 2001:db8:100::/64 mask-length-range exact
set /routing-policy prefix-set MONITOR-P1 prefix 2001:db8:200::/64 mask-length-range exact

set /routing-policy policy EXPORT-ROUTES default-action policy-result reject

set /routing-policy policy EXPORT-ROUTES statement 10 match protocol local
set /routing-policy policy EXPORT-ROUTES statement 10 match prefix-set ISP-LAN
set /routing-policy policy EXPORT-ROUTES statement 10 action bgp communities add ISP-LAN
set /routing-policy policy EXPORT-ROUTES statement 10 action policy-result next-policy

set /routing-policy policy EXPORT-ROUTES statement 20 match protocol local
set /routing-policy policy EXPORT-ROUTES statement 20 match prefix-set MONITOR-P1
set /routing-policy policy EXPORT-ROUTES statement 20 action bgp communities add MONITOR-P1
set /routing-policy policy EXPORT-ROUTES statement 20 action policy-result next-policy

set /routing-policy policy EXPORT-TO-PROVIDER1 default-action policy-result reject

set /routing-policy policy EXPORT-TO-PROVIDER1 statement 10 match bgp community-set ISP-LAN
set /routing-policy policy EXPORT-TO-PROVIDER1 statement 10 action policy-result next-policy

set /routing-policy policy EXPORT-TO-PROVIDER1 statement 20 match bgp community-set MONITOR-P1
set /routing-policy policy EXPORT-TO-PROVIDER1 statement 20 action policy-result next-policy

set /routing-policy policy EXPORT-TO-PROVIDER2 default-action policy-result reject

set /routing-policy policy EXPORT-TO-PROVIDER2 statement 10 match bgp community-set ISP-LAN
set /routing-policy policy EXPORT-TO-PROVIDER2 statement 10 action policy-result next-policy

set /routing-policy policy EXPORT-PROVIDER1 default-action policy-result reject

set /routing-policy policy EXPORT-PROVIDER1 statement 10 action policy-result accept

set /routing-policy policy EXPORT-PROVIDER2 default-action policy-result reject

set /routing-policy policy EXPORT-PROVIDER2 statement 10 action bgp as-path prepend repeat-n 3 as-number 65000
set /routing-policy policy EXPORT-PROVIDER2 statement 10 action policy-result accept

set /routing-policy policy IMPORT-PROVIDER1 default-action policy-result reject

set /routing-policy policy IMPORT-PROVIDER1 statement 10 action bgp local-preference set 200
set /routing-policy policy IMPORT-PROVIDER1 statement 10 action policy-result accept


set /routing-policy policy IMPORT-PROVIDER2 default-action policy-result reject

set /routing-policy policy IMPORT-PROVIDER2 statement 10 action bgp local-preference set 100
set /routing-policy policy IMPORT-PROVIDER2 statement 10 action policy-result accept

set /network-instance default protocols bgp group backbone-prov1 import-policy [ IMPORT-PROVIDER1 ]

set /network-instance default protocols bgp group backbone-prov1 export-policy [ EXPORT-ROUTES EXPORT-TO-PROVIDER1 EXPORT-PROVIDER1 ]
set /network-instance default protocols bgp group backbone-prov2 import-policy [ IMPORT-PROVIDER2 ]
set /network-instance default protocols bgp group backbone-prov2 export-policy [ EXPORT-ROUTES EXPORT-TO-PROVIDER2 EXPORT-PROVIDER2 ]

set /network-instance default protocols linux import-routes true
set /network-instance default protocols linux export-routes true
set /network-instance default protocols linux export-neighbors true
