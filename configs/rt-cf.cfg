set /network-instance default admin-state enable
set /network-instance default ip-forwarding receive-ipv6-check true

set /interface ethernet-1/1 admin-state enable
set /interface ethernet-1/1 subinterface 0 admin-state enable
set /interface ethernet-1/1 subinterface 0 ipv6 admin-state enable
set /interface ethernet-1/1 subinterface 0 ipv6 address 2001:db8:6::2/64
set /network-instance default interface ethernet-1/1.0

set /interface ethernet-1/2 admin-state enable
set /interface ethernet-1/2 subinterface 0 admin-state enable
set /interface ethernet-1/2 subinterface 0 ipv6 admin-state enable
set /interface ethernet-1/2 subinterface 0 ipv6 address 2001:db8:800::1/64
set /network-instance default interface ethernet-1/2.0

set /interface system0 admin-state enable
set /interface system0 subinterface 0 admin-state enable
set /interface system0 subinterface 0 ipv6 admin-state enable
set /interface system0 subinterface 0 ipv6 address 2001:db8:6516::1/128
set /network-instance default interface system0.0

set /network-instance default protocols bgp admin-state enable
set /network-instance default protocols bgp autonomous-system 65160
set /network-instance default protocols bgp router-id 10.6.0.1
set /network-instance default protocols bgp afi-safi ipv6-unicast admin-state enable

set /network-instance default protocols bgp group transit admin-state enable
set /network-instance default protocols bgp group transit description "Transit AS65100"
set /network-instance default protocols bgp group transit afi-safi ipv6-unicast admin-state enable

set /network-instance default protocols bgp neighbor 2001:db8:6::1 admin-state enable
set /network-instance default protocols bgp neighbor 2001:db8:6::1 peer-as 65100
set /network-instance default protocols bgp neighbor 2001:db8:6::1 peer-group transit

set /routing-policy prefix-set CF-INFRA prefix 2001:db8:6516::1/128 mask-length-range exact

set /routing-policy prefix-set CF-DNS prefix 2001:db8:800::/64 mask-length-range exact

set /routing-policy community-set CF-SERVICES member [65160:100]

set /routing-policy community-set TRANSIT-INFRA member [65100:200]
set /routing-policy prefix-set TRANSIT-INFRA prefix 2001:db8:6510::1/128 mask-length-range exact

set /routing-policy policy IMPORT-FROM-TRANSIT default-action policy-result accept
set /network-instance default protocols bgp group transit import-policy [ IMPORT-FROM-TRANSIT ]

set /routing-policy policy EXPORT-CF statement 10 match prefix-set CF-INFRA
set /routing-policy policy EXPORT-CF statement 10 match protocol local
set /routing-policy policy EXPORT-CF statement 10 action policy-result accept
set /routing-policy policy EXPORT-CF statement 10 action bgp communities add CF-SERVICES 

set /routing-policy policy EXPORT-CF statement 20 match prefix-set CF-DNS
set /routing-policy policy EXPORT-CF statement 20 match protocol local
set /routing-policy policy EXPORT-CF statement 20 action bgp communities add CF-SERVICES 
set /routing-policy policy EXPORT-CF statement 20 action policy-result accept

set /routing-policy policy EXPORT-CF default-action policy-result reject

set /network-instance default protocols bgp group transit export-policy [ EXPORT-CF ]

set /network-instance default protocols linux import-routes true
set /network-instance default protocols linux export-routes true
set /network-instance default protocols linux export-neighbors true
